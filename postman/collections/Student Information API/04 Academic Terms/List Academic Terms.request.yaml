$kind: http-request
order: 1000
method: GET
url: '{{base_url}}/academic-terms'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Response is an array or paginated list", () => {
        const json = pm.response.json();
        const list = Array.isArray(json) ? json : (json.data || []);
        pm.expect(list).to.be.an("array");
      });

      const json = pm.response.json();
      const list = Array.isArray(json) ? json : (json.data || []);
      if (list.length > 0) {
        pm.environment.set("academic_term_id", list[0].id);
        console.log("academic_term_id set to", list[0].id);
      }
