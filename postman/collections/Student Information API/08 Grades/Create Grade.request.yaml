$kind: http-request
order: 2000
method: POST
url: '{{base_url}}/grades'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "enrollment_id": {{enrollment_id}},
      "midterm_grade": 85.5,
      "final_grade": 90.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", () => {
        pm.response.to.have.status(201);
      });

      pm.test("Grade has midterm and final values", () => {
        const json = pm.response.json();
        const grade = json.data || json;
        pm.expect(grade).to.have.property("id");
        pm.expect(grade).to.have.property("midterm_grade");
        pm.expect(grade).to.have.property("final_grade");
      });

      pm.test("Grade values are within 0-100 range", () => {
        const json = pm.response.json();
        const grade = json.data || json;
        pm.expect(grade.midterm_grade).to.be.within(0, 100);
        pm.expect(grade.final_grade).to.be.within(0, 100);
      });
