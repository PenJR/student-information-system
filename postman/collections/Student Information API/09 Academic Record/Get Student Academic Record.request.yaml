$kind: http-request
order: 1000
method: GET
url: '{{base_url}}/students/{{student_id}}/academic-record'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Academic record has student info", () => {
        const json = pm.response.json();
        const record = json.data || json;
        pm.expect(record).to.be.an("object");
      });
