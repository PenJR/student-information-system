$kind: http-request
order: 1000
method: POST
url: '{{base_url}}/auth/login'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{admin_email}}",
      "password": "{{admin_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Response has token", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("token");
        pm.expect(json.token).to.be.a("string").and.not.empty;
      });

      pm.test("Response has user object", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("user");
        pm.expect(json.user).to.have.property("email");
      });

      const json = pm.response.json();
      if (json && json.token) {
        pm.environment.set("auth_token", json.token);
        console.log("auth_token saved to environment");
      }
