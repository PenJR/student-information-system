$kind: http-request
order: 3000
method: GET
url: '{{base_url}}/programs/{{program_id}}'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => {
        pm.response.to.have.status(200);
      });

      pm.test("Program has expected fields", () => {
        const json = pm.response.json();
        const program = json.data || json;
        pm.expect(program).to.have.property("id");
        pm.expect(program).to.have.property("name");
      });
